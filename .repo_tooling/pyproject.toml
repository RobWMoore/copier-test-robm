[project]
name = "repo-tooling"
version = "0.1.0"
description = "Repository-local project management commands."
requires-python = ">=3.11.1"
dependencies = [
    "pytest>=8.0",
    "tomlkit>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]

[tool.uv.build-backend]
module-root = ""
