[project]
name = "checks"
version = "0.1.0"
description = "Repository-local developer check commands."
requires-python = "==3.14.0"
dependencies = [
    "pytest>=8.0",
    "checks-superstaq>=0.5.66",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }]
